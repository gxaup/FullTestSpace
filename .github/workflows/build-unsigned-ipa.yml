name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Resolve Swift Package Manager Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release

      - name: Build Unsigned iOS Archive (.xcarchive)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into Unsigned IPA
        run: |
          mkdir -p build/export/Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/App.xcarchive -name "*.app" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::Compiled .app bundle not found inside xcarchive!"
            exit 1
          fi
          echo "Found compiled app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/export/Payload/
          cd build/export
          zip -r -y TopviewLogger-Unsigned.ipa Payload
          rm -rf Payload
          echo "✓ Successfully packaged unsigned IPA:"
          ls -lh TopviewLogger-Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopviewLogger-Unsigned-IPA
          path: build/export/TopviewLogger-Unsigned.ipa
          retention-days: 30
          if-no-files-found: error
